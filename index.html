<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lexrejoin - Web Control Panel</title>
    <!-- Tailwind CSS (Tampilan Modern & Ringan) -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen p-4 sm:p-6">

    <div class="max-w-xl mx-auto space-y-6">
        <!-- Header -->
        <div class="border-b border-slate-700 pb-4 text-center sm:text-left">
            <h1 class="text-2xl font-bold text-emerald-400">⚡ Lexrejoin Panel</h1>
            <p class="text-xs text-slate-400">Open-Source Roblox Rejoiner System (Free Edition)</p>
        </div>

        <!-- Form Command Rejoin -->
        <div class="bg-slate-800 p-5 rounded-2xl border border-slate-700 space-y-4 shadow-xl">
            <h2 class="text-lg font-semibold border-b border-slate-700 pb-2">🎯 Control Target</h2>
            
            <div>
                <label class="block text-xs font-medium text-slate-300 mb-1">PLACE ID (Wajib)</label>
                <input type="number" id="placeId" placeholder="Contoh: 2753915549" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-sm focus:outline-none focus:border-emerald-500">
            </div>

            <div>
                <label class="block text-xs font-medium text-slate-300 mb-1">JOB ID / SERVER INSTANCE (Opsional)</label>
                <input type="text" id="jobId" placeholder="Contoh: e7a9c841-..." class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-sm focus:outline-none focus:border-emerald-500">
            </div>

            <button onclick="sendRejoinCommand()" class="w-full bg-emerald-600 hover:bg-emerald-500 font-bold py-3 rounded-lg transition active:scale-95 shadow-lg shadow-emerald-900/40">
                🚀 REJOIN ALL TUYUL
            </button>
        </div>

        <!-- Log Monitor -->
        <div class="bg-slate-800 p-5 rounded-2xl border border-slate-700">
            <h2 class="text-sm font-semibold text-slate-400 mb-2">📜 Live Activity Log</h2>
            <div id="logBox" class="bg-slate-950 p-3 rounded-lg font-mono text-xs text-emerald-400 h-32 overflow-y-auto space-y-1 border border-slate-800">
                <p class="text-slate-500">> System Ready. Waiting for action...</p>
            </div>
        </div>
    </div>

    <!-- Firebase SDK (Modular Via CDN) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // Konfigurasi dari proyek Lexrejoin kamu
        const firebaseConfig = {
            apiKey: "AIzaSyBzO0JAzlfrymNVCbxIXjB75EPgJ_kf02w",
            authDomain: "lexrejoin.firebaseapp.com",
            databaseURL: "https://lexrejoin-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "lexrejoin",
            storageBucket: "lexrejoin.firebasestorage.app",
            messagingSenderId: "982970556842",
            appId: "1:982970556842:web:18f4e6745f1e56926f8bd3"
        };

        // Inisialisasi Firebase
        const app = initializeApp(firebaseConfig);
        const database = getDatabase(app);

        // Fungsi Kirim Perintah Rejoin
        window.sendRejoinCommand = function() {
            const placeId = document.getElementById('placeId').value;
            const jobId = document.getElementById('jobId').value;
            const logBox = document.getElementById('logBox');

            if (!placeId) {
                alert('Isi Place ID game-nya dulu, Dit!');
                return;
            }

            const timestamp = new Date().toLocaleTimeString();

            // Tulis data perintah ke Firebase Realtime Database
            set(ref(database, 'rejoin_command/current'), {
                placeId: placeId,
                jobId: jobId || "",
                timestamp: Date.now()
            }).then(() => {
                const logItem = document.createElement('p');
                logItem.textContent = `> [${timestamp}] Command Sent! Place: ${placeId}`;
                logBox.appendChild(logItem);
                logBox.scrollTop = logBox.scrollHeight;
            }).catch((error) => {
                alert('Gagal ngirim perintah: ' + error.message);
            });
        };
    </script>
</body>
</html>
